[project]
name = "funproxy"
version = "0.0.4"
description = "funproxy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["demjson3>=3.0.6", "farlog>=1.1.7", "funshell>=1.0.19", "lxml>=5.0", "requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8.0.0", "funbuild>=1.6.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funproxy"]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
